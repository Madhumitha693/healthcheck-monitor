name: CI/CD Pipeline for HealthCheck Monitor

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/healthcheck-monitor:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/healthcheck-monitor:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Connect to AKS
        run: az aks get-credentials --resource-group healthcheck-rg --name healthcheck-aks --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: ✅ Verify Deployment
        run: |
          echo "⏳ Checking pod and service status..."
          kubectl get pods -o wide
          kubectl get svc
          echo ""
          echo "🌐 Fetching External IP of service..."
          kubectl get svc healthcheck-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
          echo ""
          echo "✅ Deployment verification complete!"
