name: CI/CD Pipeline - HealthCheck Monitor

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Log in to Azure
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 3: Log in to Azure Container Registry (ACR)
      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # Step 4: Build and push Docker image to ACR
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/healthcheck-app:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/healthcheck-app:latest

      # Step 5: Connect to AKS Cluster
      - name: Set AKS context
        run: az aks get-credentials --resource-group healthcheck-rg --name healthcheck-aks --overwrite-existing

      # Step 6: Deploy application to AKS
      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      # Step 7: Verify Deployment and Capture External IP
      - name: Verify Deployment
        id: verify
        run: |
          echo "⏳ Verifying deployment..."
          kubectl get pods
          kubectl get svc
          echo "🔍 Fetching external IP..."
          EXTERNAL_IP=$(kubectl get svc healthcheck-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "🌐 Access the app here: http://$EXTERNAL_IP"
          echo "external_ip=$EXTERNAL_IP" >> $GITHUB_OUTPUT

      # Step 8: Post summary to GitHub Actions UI
      - name: Post Result Summary
        run: |
          echo "✅ **Deployment Verification Complete**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Access the live app here:** [http://${{ steps.verify.outputs.external_ip }}](http://${{ steps.verify.outputs.external_ip }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕒 Deployment completed on $(date)" >> $GITHUB_STEP_SUMMARY
